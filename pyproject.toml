[project]
name = "dash-router"
version = "0.8.0"
description = "File-system based nested & parallel router for Dash 4.5+ (Quart, FastAPI)"
authors = [{ name = "Christian Giessel", email = "cgiessel@tesla.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "dash>=4.0",
  "pydantic>=2.9.2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9.0,<0.10",
  "basedpyright>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dash_router"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["src/dash_router/_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dash_router"]

[tool.basedpyright]
include = ["src", "tests"]
ignore = ["src/dash_router/_components"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportPrivateImportUsage = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportAny = false

